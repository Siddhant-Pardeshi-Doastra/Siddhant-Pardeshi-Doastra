<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-label="LTET Conversational AI Engine — flagship product panel with live spec chips">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2236"/>
      <stop offset="60%" stop-color="#0d2f4a"/>
      <stop offset="100%" stop-color="#081726"/>
    </linearGradient>
    <linearGradient id="ftitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe0d6"/>
      <stop offset="1" stop-color="#f0cd7e"/>
    </linearGradient>
    <filter id="fsoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="fdots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1d5f95"/>
    </pattern>
  </defs>

  <rect x="16" y="16" width="1468" height="508" rx="20" fill="url(#fbg)"/>
  <rect x="16" y="16" width="1468" height="508" rx="20" fill="url(#fdots)" opacity="0.4"/>
  <rect x="16" y="16" width="1468" height="508" rx="20" fill="none" stroke="#1d5f95" stroke-width="1.6"/>

  <!-- flagship label -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>
    <rect x="60" y="52" width="176" height="34" rx="17" fill="none" stroke="#f0cd7e" stroke-width="1.6"/>
    <text x="148" y="74" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="14" letter-spacing="4" fill="#f0cd7e">FLAGSHIP</text>
  </g>

  <!-- left column: mic + rings + copy -->
  <g transform="translate(150,250)">
    <circle r="64" fill="none" stroke="#2fbf9f" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="64;104" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="64" fill="none" stroke="#2fbf9f" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="64;104" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="#0b4f4b" stroke="#7fe0d6" stroke-width="2"/>
    <rect x="-11" y="-26" width="22" height="34" rx="11" fill="#7fe0d6"/>
    <path d="M -20 -6 A 20 20 0 0 0 20 -6" fill="none" stroke="#f0cd7e" stroke-width="3.2"/>
    <line x1="0" y1="-6" x2="0" y2="10" stroke="#f0cd7e" stroke-width="3.2"/>
    <circle cx="0" cy="16" r="3.4" fill="#f0cd7e"/>
  </g>

  <text x="270" y="212" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-weight="bold" font-size="40" fill="url(#ftitle)" opacity="0">LTET CONVERSATIONAL
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
  </text>
  <text x="270" y="258" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-weight="bold" font-size="40" fill="url(#ftitle)" opacity="0">AI ENGINE
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
  </text>

  <g font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="16" fill="#a8c4d8">
    <text x="272" y="296" opacity="0">Deterministic, fact-safe voice assistant for the<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/></text>
    <text x="272" y="322" opacity="0">LTET Employee Trust Portal — verified claim-status,<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/></text>
    <text x="272" y="348" opacity="0">payment &amp; beneficiary enquiries across<tspan fill="#7fe0d6" font-weight="bold"> 22 languages</tspan>,<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.9s" fill="freeze"/></text>
    <text x="272" y="374" opacity="0">then auditable post-call intelligence for processors.<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/></text>
  </g>

  <text x="272" y="408" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#7c8fd6" opacity="0">Dial-in helpline: PS + name + DOB verification · governed administration
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
  </text>

  <!-- right column: spec chips -->
  <g font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-weight="bold" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
      <rect x="880" y="120" width="256" height="64" rx="12" fill="#081726" stroke="#2fbf9f" stroke-width="1.6"/>
      <text x="1008" y="147" font-size="26" fill="#7fe0d6">22</text>
      <text x="1008" y="170" font-size="13" letter-spacing="2" fill="#a8c4d8">LANGUAGES</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
      <rect x="1156" y="120" width="256" height="64" rx="12" fill="#081726" stroke="#2fbf9f" stroke-width="1.6"/>
      <text x="1284" y="147" font-size="26" fill="#7fe0d6">105</text>
      <text x="1284" y="170" font-size="13" letter-spacing="2" fill="#a8c4d8">TESTS PASSING</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
      <rect x="880" y="204" width="256" height="64" rx="12" fill="#081726" stroke="#f0cd7e" stroke-width="1.6"/>
      <text x="1008" y="231" font-size="26" fill="#f0cd7e">ZERO</text>
      <text x="1008" y="254" font-size="13" letter-spacing="2" fill="#a8c4d8">API KEYS REQUIRED</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
      <rect x="1156" y="204" width="256" height="64" rx="12" fill="#081726" stroke="#2fbf9f" stroke-width="1.6"/>
      <text x="1284" y="231" font-size="26" fill="#7fe0d6">NODE.JS</text>
      <text x="1284" y="254" font-size="13" letter-spacing="2" fill="#a8c4d8">≥ 22.13 · SQLITE WAL</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.3s" fill="freeze"/>
      <rect x="880" y="288" width="256" height="64" rx="12" fill="#081726" stroke="#2fbf9f" stroke-width="1.6"/>
      <text x="1008" y="315" font-size="26" fill="#7fe0d6">VOICE</text>
      <text x="1008" y="338" font-size="13" letter-spacing="2" fill="#a8c4d8">SARVAM AI · OPTIONAL</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.5s" fill="freeze"/>
      <rect x="1156" y="288" width="256" height="64" rx="12" fill="#081726" stroke="#f0cd7e" stroke-width="1.6"/>
      <text x="1284" y="315" font-size="26" fill="#f0cd7e">AUDIT</text>
      <text x="1284" y="338" font-size="13" letter-spacing="2" fill="#a8c4d8">POST-CALL INTELLIGENCE</text>
    </g>
  </g>

  <!-- mini waveform echo in left column -->
  <g transform="translate(150,460)" fill="#2fbf9f">
    <rect x="-96" y="-6" width="6" height="12" rx="2"><animate attributeName="height" values="12;26;12" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-6;-13;-6" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="-72" y="-10" width="6" height="20" rx="2"><animate attributeName="height" values="20;8;24;20" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-4;-12;-10" dur="1.0s" repeatCount="indefinite"/></rect>
    <rect x="-48" y="-14" width="6" height="28" rx="2"><animate attributeName="height" values="28;14;32;28" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="-14;-7;-16;-14" dur="0.95s" repeatCount="indefinite"/></rect>
    <rect x="-24" y="-18" width="6" height="36" rx="2"><animate attributeName="height" values="36;18;40;36" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="-18;-9;-20;-18" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="0" y="-14" width="6" height="28" rx="2"><animate attributeName="height" values="28;12;34;28" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="-14;-6;-17;-14" dur="1.05s" repeatCount="indefinite"/></rect>
    <rect x="24" y="-18" width="6" height="36" rx="2"><animate attributeName="height" values="36;20;42;36" dur="0.92s" repeatCount="indefinite"/><animate attributeName="y" values="-18;-10;-21;-18" dur="0.92s" repeatCount="indefinite"/></rect>
    <rect x="48" y="-14" width="6" height="28" rx="2"><animate attributeName="height" values="28;16;30;28" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="-14;-8;-15;-14" dur="1.0s" repeatCount="indefinite"/></rect>
    <rect x="72" y="-10" width="6" height="20" rx="2"><animate attributeName="height" values="20;10;26;20" dur="1.12s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-5;-13;-10" dur="1.12s" repeatCount="indefinite"/></rect>
    <rect x="96" y="-6" width="6" height="12" rx="2"><animate attributeName="height" values="12;24;12" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="-6;-12;-6" dur="1.15s" repeatCount="indefinite"/></rect>
  </g>

  <!-- CTA bar -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.9s" fill="freeze"/>
    <rect x="60" y="492" width="1380" height="0" fill="none"/>
    <g transform="translate(750,500)">
      <rect x="-430" y="-22" width="860" height="44" rx="22" fill="#081726" stroke="#7fe0d6" stroke-width="2"/>
      <text x="-14" y="7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-weight="bold" font-size="19" letter-spacing="4" fill="#7fe0d6">VIEW THE ENGINE</text>
      <text x="150" y="7" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-weight="bold" font-size="20" fill="#f0cd7e">
        →<animate attributeName="x" values="120;160" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="1.1s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
