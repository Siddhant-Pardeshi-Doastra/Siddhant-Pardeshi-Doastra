<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="400" viewBox="0 0 1500 400" role="img" aria-label="DOASTRA — deterministic, fact-safe conversational AI">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081726"/>
      <stop offset="55%" stop-color="#0d2f4a"/>
      <stop offset="100%" stop-color="#0b4f4b"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="26s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe0d6"/>
      <stop offset="0.55" stop-color="#b9c6f2"/>
      <stop offset="1" stop-color="#f0cd7e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9e8e2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1d5f95"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="16" y="16" width="1468" height="368" rx="20" fill="url(#dbg)"/>
  <rect x="16" y="16" width="1468" height="368" rx="20" fill="url(#dots)" opacity="0.45"/>
  <rect x="16" y="16" width="1468" height="368" rx="20" fill="none" stroke="#1d5f95" stroke-width="1.6"/>

  <!-- corner brackets -->
  <g stroke="#2fbf9f" stroke-width="2.4" fill="none" opacity="0.9">
    <path d="M 44 58 L 44 40 L 62 40"/><path d="M 1438 40 L 1456 40 L 1456 58"/>
    <path d="M 44 342 L 44 360 L 62 360"/><path d="M 1456 342 L 1456 360 L 1438 360"/>
  </g>

  <!-- soft core glow behind wordmark -->
  <ellipse cx="750" cy="176" rx="420" ry="86" fill="#2fbf9f" opacity="0.12" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- wordmark: per-letter drop -->
  <g font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-weight="bold" font-size="92" letter-spacing="14" text-anchor="middle">
    <g>
      <text x="394" y="200" fill="url(#word)" opacity="0">D<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.15s" fill="freeze"/></text>
      <text x="534" y="200" fill="url(#word)" opacity="0">O<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.30s" fill="freeze"/></text>
      <text x="674" y="200" fill="url(#word)" opacity="0">A<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.45s" fill="freeze"/></text>
      <text x="814" y="200" fill="url(#word)" opacity="0">S<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.60s" fill="freeze"/></text>
      <text x="954" y="200" fill="url(#word)" opacity="0">T<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.75s" fill="freeze"/></text>
      <text x="1094" y="200" fill="url(#word)" opacity="0">R<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.90s" fill="freeze"/></text>
      <text x="1234" y="200" fill="url(#word)" opacity="0">A<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.05s" fill="freeze"/></text>
    </g>
    <!-- RGB glitch flashes -->
    <text x="750" y="200" fill="#f0cd7e" opacity="0" filter="url(#glow)">DOASTRA
      <animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="0.18s" begin="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- voice waveform: the signature motif -->
  <g>
    <rect x="560" y="262" width="9" height="8" rx="3" fill="#2fbf9f">
      <animate attributeName="height" values="8;30;12;26;8" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="266;253;264;257;266" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="586" y="254" width="9" height="24" rx="3" fill="#2fbf9f">
      <animate attributeName="height" values="24;10;34;14;24" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="258;270;253;273;258" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="612" y="250" width="9" height="32" rx="3" fill="#7fe0d6">
      <animate attributeName="height" values="32;14;40;18;32" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="254;273;250;271;254" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="638" y="258" width="9" height="16" rx="3" fill="#2fbf9f">
      <animate attributeName="height" values="16;36;10;28;16" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="262;252;275;266;262" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="664" y="246" width="9" height="40" rx="3" fill="#f0cd7e">
      <animate attributeName="height" values="40;18;44;22;40" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="250;271;248;269;250" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="690" y="254" width="9" height="24" rx="3" fill="#2fbf9f">
      <animate attributeName="height" values="24;42;12;30;24" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="258;249;274;265;258" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="716" y="250" width="9" height="32" rx="3" fill="#7fe0d6">
      <animate attributeName="height" values="32;10;38;16;32" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="254;275;251;272;254" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="742" y="244" width="9" height="44" rx="3" fill="#f0cd7e">
      <animate attributeName="height" values="44;20;48;26;44" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="248;270;246;267;248" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="768" y="250" width="9" height="32" rx="3" fill="#7fe0d6">
      <animate attributeName="height" values="32;14;40;18;32" dur="1.08s" repeatCount="indefinite"/>
      <animate attributeName="y" values="254;273;250;271;254" dur="1.08s" repeatCount="indefinite"/>
    </rect>
    <rect x="794" y="256" width="9" height="20" rx="3" fill="#2fbf9f">
      <animate attributeName="height" values="20;38;10;28;20" dur="1.22s" repeatCount="indefinite"/>
      <animate attributeName="y" values="260;251;275;266;260" dur="1.22s" repeatCount="indefinite"/>
    </rect>
    <rect x="820" y="246" width="9" height="40" rx="3" fill="#f0cd7e">
      <animate attributeName="height" values="40;16;44;20;40" dur="0.98s" repeatCount="indefinite"/>
      <animate attributeName="y" values="250;272;248;270;250" dur="0.98s" repeatCount="indefinite"/>
    </rect>
    <rect x="846" y="254" width="9" height="24" rx="3" fill="#2fbf9f">
      <animate attributeName="height" values="24;12;34;14;24" dur="1.16s" repeatCount="indefinite"/>
      <animate attributeName="y" values="258;274;253;273;258" dur="1.16s" repeatCount="indefinite"/>
    </rect>
    <rect x="872" y="250" width="9" height="32" rx="3" fill="#7fe0d6">
      <animate attributeName="height" values="32;18;40;16;32" dur="1.04s" repeatCount="indefinite"/>
      <animate attributeName="y" values="254;271;250;272;254" dur="1.04s" repeatCount="indefinite"/>
    </rect>
    <rect x="898" y="260" width="9" height="12" rx="3" fill="#2fbf9f">
      <animate attributeName="height" values="12;32;10;26;12" dur="1.28s" repeatCount="indefinite"/>
      <animate attributeName="y" values="264;254;275;267;264" dur="1.28s" repeatCount="indefinite"/>
    </rect>
    <rect x="924" y="256" width="9" height="20" rx="3" fill="#2fbf9f">
      <animate attributeName="height" values="20;40;12;30;20" dur="1.18s" repeatCount="indefinite"/>
      <animate attributeName="y" values="260;250;274;265;260" dur="1.18s" repeatCount="indefinite"/>
    </rect>
    <rect x="950" y="262" width="9" height="8" rx="3" fill="#7fe0d6">
      <animate attributeName="height" values="8;28;12;24;8" dur="1.32s" repeatCount="indefinite"/>
      <animate attributeName="y" values="266;256;264;258;266" dur="1.32s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tagline -->
  <text x="750" y="346" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="19" letter-spacing="6" fill="#a8c4d8" opacity="0">DETERMINISTIC · FACT-SAFE · CONVERSATIONAL AI
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- live tag -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.6s" fill="freeze"/>
    <circle cx="1380" cy="54" r="5" fill="#39ff14">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1368" y="59" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#c9e8e2">BUILDING THE LTET EMPLOYEE TRUST PORTAL</text>
  </g>

  <!-- sheen sweep -->
  <rect x="-260" y="16" width="220" height="368" fill="url(#sheen)">
    <animate attributeName="x" values="-260;1500" dur="2.4s" begin="3s" repeatCount="indefinite"/>
  </rect>
</svg>
